<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Etiquetas básicas · Clases interactivas</title>
<link rel="stylesheet" href="../assets/css/base.css">
<style>
  :root {
    --t-h: #e44d26; --t-p: #2a9d8f; --t-a: #1a5fb4; --t-img: #7b2cbf; --t-button: #d6336c; --t-input: #b26a00;
  }
  .modes { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .modes .seg button { font-size: 1.02rem; padding: 9px 16px; }
  .modes .right { margin-left: auto; display: flex; gap: 14px; align-items: center; }

  .workspace { display: grid; grid-template-columns: 230px minmax(0, 1fr) minmax(0, 1.1fr); gap: 16px; margin-top: 16px; align-items: start; }
  @media (max-width: 1100px) { .workspace { grid-template-columns: 1fr; } }
  .col-title { font-size: .78rem; text-transform: uppercase; letter-spacing: .08em; color: var(--ink-2); font-weight: 700; margin: 0 0 10px; display: flex; justify-content: space-between; align-items: center; }

  /* ---------- paleta ---------- */
  .palette { display: flex; flex-direction: column; gap: 8px; }
  .pal-btn { --c: #555; display: flex; align-items: center; gap: 10px; text-align: left; border: 2px solid color-mix(in srgb, var(--c) 35%, white); background: #fff; border-radius: 12px; padding: 9px 12px; cursor: pointer; font: inherit; transition: transform .12s, box-shadow .12s; }
  .pal-btn:hover { transform: translateX(3px); box-shadow: 0 4px 12px color-mix(in srgb, var(--c) 25%, transparent); border-color: var(--c); }
  .pal-btn:active { transform: scale(.97); }
  .pal-btn .tg { font-family: var(--mono); font-weight: 800; color: #fff; background: var(--c); border-radius: 7px; padding: 2px 7px; font-size: .9rem; min-width: 64px; text-align: center; }
  .pal-btn .ds { font-size: .92rem; line-height: 1.2; }
  .pal-btn .ds small { display: block; color: var(--ink-2); font-size: .78rem; }

  /* ---------- documento (piezas) ---------- */
  .doc { min-height: 380px; background: #fff; border: 1px solid var(--line); border-radius: var(--radius); padding: 14px; box-shadow: var(--shadow); display: flex; flex-direction: column; gap: 8px; }
  .doc-empty { color: var(--ink-2); text-align: center; padding: 60px 10px; border: 2px dashed var(--line); border-radius: 12px; }
  .piece { --c: #555; position: relative; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; padding: 8px 10px 8px 6px; border-radius: 12px; background: color-mix(in srgb, var(--c) 9%, white); border: 2px solid color-mix(in srgb, var(--c) 40%, white); font-family: var(--mono); font-size: 15px; transition: box-shadow .2s, border-color .2s, opacity .25s, transform .25s; }
  .piece.hot { border-color: var(--c); box-shadow: 0 0 0 4px color-mix(in srgb, var(--c) 22%, transparent); }
  .piece.entering { opacity: 0; transform: scale(.9); }
  .piece.leaving { opacity: 0; transform: translateX(30px) scale(.9); }
  .piece.dragging { opacity: .35; }
  .piece.drop-before::before, .piece.drop-after::after { content: ""; position: absolute; left: 6px; right: 6px; height: 4px; border-radius: 4px; background: var(--brand-2); }
  .piece.drop-before::before { top: -7px; } .piece.drop-after::after { bottom: -7px; }
  .grip { cursor: grab; color: color-mix(in srgb, var(--c) 60%, #999); padding: 0 2px; user-select: none; font-family: var(--sans); }
  .tag { color: var(--c); font-weight: 800; white-space: nowrap; }
  .txt { font-family: var(--sans); font-size: 16px; padding: 2px 6px; border-radius: 6px; background: #fff; border: 1px dashed color-mix(in srgb, var(--c) 45%, white); min-width: 40px; outline: none; }
  .txt:focus { border-style: solid; border-color: var(--c); }
  .attr { color: #555; white-space: nowrap; display: inline-flex; align-items: center; gap: 2px; }
  .attr .an { color: #8a5a00; }
  .attr select, .attr input { font: inherit; font-size: 14px; border: 1px dashed #c9b27c; background: #fffaf0; border-radius: 6px; padding: 1px 4px; color: #6b4a00; max-width: 280px; }
  .tools { margin-left: auto; display: flex; gap: 2px; opacity: .35; transition: opacity .15s; }
  .piece:hover .tools, .piece:focus-within .tools { opacity: 1; }
  .tools button { border: 0; background: transparent; cursor: pointer; font-size: 14px; width: 26px; height: 26px; border-radius: 6px; color: var(--ink-2); }
  .tools button:hover { background: rgba(0,0,0,.07); color: var(--ink); }
  .ghost { position: fixed; z-index: 100; pointer-events: none; transition: all .45s cubic-bezier(.3,.8,.3,1); }

  /* ---------- navegador ---------- */
  .browser { background: #fff; border: 1px solid var(--line); border-radius: 14px; box-shadow: var(--shadow); overflow: hidden; }
  .chrome { background: #e8e4de; padding: 9px 12px; display: flex; align-items: center; gap: 10px; }
  .lights { display: flex; gap: 6px; } .lights i { width: 12px; height: 12px; border-radius: 50%; background: #f26b5b; } .lights i:nth-child(2) { background: #f6bf4f; } .lights i:nth-child(3) { background: #5ec860; }
  .addr { flex: 1; background: #fff; border-radius: 999px; padding: 5px 14px; font-family: var(--mono); font-size: 14px; color: var(--ink-2); }
  .viewport { position: relative; min-height: 380px; max-height: 560px; overflow: auto; }
  .page-host { padding: 6px 18px 24px; }
  .xray-layer { position: absolute; left: 0; top: 0; pointer-events: none; }
  .xbox { position: absolute; border: 2px dashed var(--c); border-radius: 4px; background: color-mix(in srgb, var(--c) 7%, transparent); transition: all .2s; }
  .xbox .xl { position: absolute; top: -11px; left: -2px; background: var(--c); color: #fff; font-family: var(--mono); font-size: 11px; font-weight: 700; padding: 0 5px; border-radius: 4px; white-space: nowrap; }
  .xbox.hot { border-style: solid; background: color-mix(in srgb, var(--c) 16%, transparent); }
  .toast { position: absolute; left: 50%; bottom: 14px; transform: translate(-50%, 20px); opacity: 0; background: var(--ink); color: #fff; padding: 8px 14px; border-radius: 10px; font-size: .9rem; transition: all .25s; pointer-events: none; z-index: 5; }
  .toast.show { transform: translate(-50%, 0); opacity: 1; }

  /* ---------- desafío ---------- */
  .challenge-box { margin-top: 14px; }
  .target-card { background: #fff; border: 1px solid var(--line); border-radius: 12px; padding: 10px; }
  .target-mini { border: 1px solid var(--line); border-radius: 8px; overflow: hidden; height: 190px; position: relative; background: #fff; }
  .target-mini .scaler { transform: scale(.5); transform-origin: 0 0; width: 200%; padding: 4px 14px; }
  .checklist { list-style: none; padding: 0; margin: 10px 0 0; display: flex; flex-direction: column; gap: 5px; font-size: .88rem; }
  .checklist li { display: flex; gap: 6px; align-items: flex-start; }
  .checklist li .ck { flex: none; width: 20px; height: 20px; border-radius: 6px; display: grid; place-items: center; font-size: 12px; background: var(--surface-2); color: var(--ink-2); transition: all .3s; }
  .checklist li.done .ck { background: var(--ok); color: #fff; transform: scale(1.1); }
  .checklist li.done { color: var(--ok); }
  .ch-nav { display: flex; gap: 6px; margin-top: 10px; }
  .ch-nav button { flex: 1; }

  /* ---------- juego ---------- */
  .game { display: grid; grid-template-columns: minmax(0, 1.2fr) minmax(0, 1fr); gap: 16px; margin-top: 16px; }
  @media (max-width: 1000px) { .game { grid-template-columns: 1fr; } }
  .spot { position: absolute; border-radius: 6px; box-shadow: 0 0 0 9999px rgba(20, 18, 28, .55); transition: all .45s cubic-bezier(.3,.8,.3,1); pointer-events: none; }
  .spot::after { content: ""; position: absolute; inset: -6px; border: 3px solid #ffd666; border-radius: 10px; animation: pulse 1.1s ease-in-out infinite; }
  @keyframes pulse { 50% { inset: -11px; opacity: .4; } }
  .q-title { font-size: 1.6rem; font-weight: 700; margin-bottom: 4px; }
  .answers { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 14px; }
  .answers button { --c: #555; font-family: var(--mono); font-size: 1.3rem; font-weight: 800; padding: 16px; border-radius: 14px; border: 3px solid color-mix(in srgb, var(--c) 35%, white); color: var(--c); background: #fff; cursor: pointer; transition: transform .12s, background .2s; }
  .answers button:hover:not(:disabled) { transform: translateY(-2px); border-color: var(--c); }
  .answers button.right { background: var(--ok); border-color: var(--ok); color: #fff; animation: pop .4s; }
  .answers button.wrong { background: var(--bad); border-color: var(--bad); color: #fff; animation: shake .4s; }
  .answers button:disabled:not(.right):not(.wrong) { opacity: .45; }
  @keyframes pop { 50% { transform: scale(1.08); } }
  @keyframes shake { 25% { transform: translateX(-6px); } 75% { transform: translateX(6px); } }
  .feedback { min-height: 3.2em; margin-top: 14px; font-size: 1.1rem; }
  .scoreboard { display: flex; gap: 14px; align-items: center; font-weight: 700; font-size: 1.1rem; }
  .progress { flex: 1; height: 10px; background: var(--surface-2); border-radius: 999px; overflow: hidden; }
  .progress i { display: block; height: 100%; background: var(--brand-2); transition: width .3s; }

  .confetti { position: fixed; top: -20px; width: 10px; height: 14px; z-index: 200; pointer-events: none; animation: fall linear forwards; }
  @keyframes fall { to { transform: translateY(110vh) rotate(720deg); } }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<header class="topbar">
  <div class="logo">A</div>
  <nav class="crumbs"><a href="../index.html">Clases interactivas</a> › HTML y CSS › <strong>Etiquetas básicas</strong></nav>
</header>

<main class="page">
  <div class="modes">
    <div class="seg" id="modeSeg">
      <button data-v="build" aria-pressed="true">🧱 Construir</button>
      <button data-v="challenge">🎯 Desafíos</button>
      <button data-v="game">🔎 ¿Qué etiqueta es?</button>
    </div>
    <div class="right" id="buildTools">
      <label class="switch"><input type="checkbox" id="xray"> 🩻 Rayos X</label>
      <button class="btn" id="exampleBtn">✨ Ejemplo</button>
      <button class="btn" id="clearBtn">🗑️ Vaciar</button>
    </div>
  </div>

  <!-- ============================================ construir / desafíos -->
  <div class="workspace" id="workspace">
    <aside>
      <h3 class="col-title">Piezas</h3>
      <div class="palette" id="palette"></div>
      <div class="challenge-box" id="challengeBox" hidden>
        <h3 class="col-title" style="display:block">Objetivo · <span id="chCount" style="color:var(--ink)"></span></h3>
        <div class="target-card">
          <div class="target-mini"><div class="scaler" id="targetMini"></div></div>
          <ol class="checklist" id="checklist"></ol>
          <div class="ch-nav"><button class="btn" id="chPrev">◀</button><button class="btn" id="chNext">▶</button></div>
        </div>
      </div>
    </aside>

    <section>
      <h3 class="col-title">Tu código HTML <span style="text-transform:none; letter-spacing:0; font-weight:400">arrastrá ⋮⋮ para reordenar</span></h3>
      <div class="doc" id="doc"></div>
    </section>

    <section>
      <h3 class="col-title">Lo que muestra el navegador</h3>
      <div class="browser">
        <div class="chrome"><div class="lights"><i></i><i></i><i></i></div><div class="addr">mi-pagina.html</div></div>
        <div class="viewport" id="viewport">
          <div class="page-host" id="host"></div>
          <div class="xray-layer" id="xrayLayer"></div>
          <div class="toast" id="toast"></div>
        </div>
      </div>
    </section>
  </div>

  <!-- ============================================ juego -->
  <div class="game" id="game" hidden>
    <section>
      <div class="browser">
        <div class="chrome"><div class="lights"><i></i><i></i><i></i></div><div class="addr" id="gameAddr">vinoteca.html</div></div>
        <div class="viewport" id="gameViewport" style="max-height:none">
          <div class="page-host" id="gameHost"></div>
          <div class="xray-layer" id="gameXray"></div>
          <div class="spot" id="spot"></div>
        </div>
      </div>
    </section>
    <section class="card">
      <div class="scoreboard"><span id="gScore">0 / 0</span><div class="progress"><i id="gProg" style="width:0"></i></div><span id="gRound"></span></div>
      <div class="q-title" style="margin-top:16px">¿Qué etiqueta es la parte iluminada?</div>
      <div style="color:var(--ink-2)">Voten entre todos y después toquen la respuesta.</div>
      <div class="answers" id="answers"></div>
      <div class="feedback" id="feedback"></div>
      <button class="btn primary big" id="nextQ" hidden>Siguiente ▶</button>
    </section>
  </div>
</main>

<script>
(() => {
  const $ = (s, r = document) => r.querySelector(s);

  // ================================================================ imágenes (SVG embebidos)
  const svg = (w, h, body) => "data:image/svg+xml;charset=utf-8," + encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" width="${w}" height="${h}" viewBox="0 0 ${w} ${h}">${body}</svg>`);
  const IMAGES = {
    "botella.png": { label: "🍷 botella", url: svg(100, 210, `<rect width="100" height="210" fill="#f4ede4"/><rect x="42" y="10" width="16" height="50" rx="4" fill="#3b1f2b"/><path d="M42 60 Q30 80 30 100 L30 195 Q30 202 37 202 L63 202 Q70 202 70 195 L70 100 Q70 80 58 60Z" fill="#5a1e33"/><rect x="34" y="120" width="32" height="44" rx="3" fill="#f7e9c8"/><text x="50" y="146" font-family="serif" font-size="10" text-anchor="middle" fill="#5a1e33">Malbec</text>`) },
    "paisaje.png": { label: "⛰️ paisaje", url: svg(260, 150, `<rect width="260" height="150" fill="#bfe3f5"/><circle cx="205" cy="38" r="20" fill="#ffd166"/><path d="M0 150 L70 55 L120 110 L165 70 L260 150Z" fill="#6b8f71"/><path d="M58 72 L70 55 L82 72 L76 70 L70 76 L64 70Z" fill="#fff"/><rect y="128" width="260" height="22" fill="#8cb369"/><g fill="#5a1e33">${[20,40,60,80,100,120,140,160,180,200,220,240].map(x=>`<circle cx="${x}" cy="138" r="4"/>`).join("")}</g>`) },
    "gato.png":    { label: "🐱 gato",    url: svg(180, 150, `<rect width="180" height="150" fill="#fde2c8"/><path d="M50 60 L60 20 L80 50 L100 50 L120 20 L130 60 Q140 120 90 125 Q40 120 50 60Z" fill="#f4a261"/><circle cx="75" cy="78" r="7" fill="#2b2d42"/><circle cx="105" cy="78" r="7" fill="#2b2d42"/><path d="M85 92 L95 92 L90 98Z" fill="#e76f51"/><path d="M90 98 Q82 106 76 102 M90 98 Q98 106 104 102" stroke="#2b2d42" stroke-width="2" fill="none"/>`) },
  };

  // ================================================================ etiquetas
  const TAGS = {
    h:      { color: "var(--t-h)",      name: "Título",          hint: "h1 a h6: del más importante al menos", make: () => ({ tag: "h", level: 1, text: "Mi título" }) },
    p:      { color: "var(--t-p)",      name: "Párrafo",         hint: "un bloque de texto",                  make: () => ({ tag: "p", text: "Un párrafo de texto." }) },
    a:      { color: "var(--t-a)",      name: "Enlace",          hint: "lleva a otra página",                 make: () => ({ tag: "a", text: "Ir a Google", href: "https://www.google.com" }) },
    img:    { color: "var(--t-img)",    name: "Imagen",          hint: "no se cierra",                        make: () => ({ tag: "img", src: "paisaje.png", alt: "Montañas y viñedos" }) },
    button: { color: "var(--t-button)", name: "Botón",           hint: "algo para apretar",                   make: () => ({ tag: "button", text: "Apretame" }) },
    input:  { color: "var(--t-input)",  name: "Campo de texto",  hint: "para que el usuario escriba",         make: () => ({ tag: "input", type: "text", placeholder: "Escribí acá" }) },
  };
  const tagName = (it) => it.tag === "h" ? "h" + it.level : it.tag;
  const colorOf = (it) => TAGS[it.tag].color;
  let uid = 1;
  const withId = (it) => ({ id: uid++, ...it });

  // ================================================================ render de una "página" en un shadow root
  // El shadow root mantiene los estilos por defecto del navegador (h1 grande, enlaces azules, etc.)
  function mountPage(hostEl) {
    const root = hostEl.attachShadow({ mode: "open" });
    root.innerHTML = `<style>:host{all:initial;display:block;font-family:Times New Roman,serif;font-size:16px;color:#000}
      .new{animation:appear .6s ease-out} @keyframes appear{from{opacity:0;transform:translateY(-10px);background:#fff3a6}to{opacity:1;transform:none;background:transparent}}
      .hot{outline:3px solid #ffd666;outline-offset:3px}
      img{max-width:100%;display:inline-block} </style><div class="page"></div>`;
    return root;
  }
  function buildEl(it) {
    const el = document.createElement(tagName(it));
    if (it.tag === "img") { el.src = IMAGES[it.src]?.url || ""; el.alt = it.alt || ""; }
    else if (it.tag === "input") { el.type = it.type; el.placeholder = it.placeholder || ""; }
    else el.textContent = it.text;
    if (it.tag === "a") el.href = it.href;
    el.dataset.id = it.id;
    return el;
  }
  function renderPage(root, items, newId) {
    const page = root.querySelector(".page");
    page.innerHTML = "";
    items.forEach(it => {
      const el = buildEl(it);
      if (it.id === newId) el.classList.add("new");
      page.appendChild(el);
      if (it.tag === "img" || it.tag === "input" || it.tag === "button" || it.tag === "a") page.appendChild(document.createTextNode(" "));
    });
  }

  // rayos X: cajas con el nombre de cada etiqueta, dibujadas encima del navegador
  function drawXray(root, layer, viewport, items, hotId, onlyId) {
    layer.innerHTML = "";
    const vr = viewport.getBoundingClientRect();
    items.forEach(it => {
      if (onlyId != null && it.id !== onlyId) return;
      const el = root.querySelector(`[data-id="${it.id}"]`); if (!el) return;
      const r = el.getBoundingClientRect();
      const b = document.createElement("div");
      b.className = "xbox" + (it.id === hotId ? " hot" : "");
      b.style.cssText = `--c:${colorOf(it)};left:${r.left - vr.left + viewport.scrollLeft - 3}px;top:${r.top - vr.top + viewport.scrollTop - 3}px;width:${r.width + 6}px;height:${r.height + 6}px`;
      b.innerHTML = `<span class="xl">&lt;${tagName(it)}&gt;</span>`;
      layer.appendChild(b);
    });
  }

  // ================================================================ estado del modo construir / desafío
  const S = { mode: "build", items: [], xray: false, hot: null, ch: 0 };
  const pageRoot = mountPage($("#host"));

  const EXAMPLE = () => [
    { tag: "h", level: 1, text: "Vinoteca del Valle" },
    { tag: "img", src: "paisaje.png", alt: "Viñedos al pie de la montaña" },
    { tag: "p", text: "Vinos de pequeños productores, directo a tu casa." },
    { tag: "h", level: 2, text: "Recibí nuestras ofertas" },
    { tag: "input", type: "email", placeholder: "tu@email.com" },
    { tag: "button", text: "Suscribirme" },
    { tag: "p", text: "" },
    { tag: "a", text: "Ver todos los vinos", href: "https://www.google.com" },
  ].filter(x => x.tag !== "p" || x.text).map(withId);

  // ---------- paleta ----------
  $("#palette").innerHTML = Object.entries(TAGS).map(([k, t]) => {
    const label = k === "h" ? "h1…h6" : k;
    return `<button class="pal-btn" data-k="${k}" style="--c:${t.color}"><span class="tg">${label}</span><span class="ds">${t.name}<small>${t.hint}</small></span></button>`;
  }).join("");
  $("#palette").addEventListener("click", (e) => {
    const b = e.target.closest(".pal-btn"); if (!b) return;
    addItem(b.dataset.k, b);
  });

  function addItem(kind, fromBtn) {
    const it = withId(TAGS[kind].make());
    S.items.push(it);
    renderDoc(it.id);
    const piece = $(`.piece[data-id="${it.id}"]`);
    piece.scrollIntoView({ block: "nearest" });
    // animación: la pieza "vuela" desde la paleta
    const from = fromBtn.querySelector(".tg").getBoundingClientRect(), to = piece.getBoundingClientRect();
    const g = document.createElement("div");
    g.className = "ghost";
    g.innerHTML = fromBtn.querySelector(".tg").outerHTML;
    g.style.cssText = `left:${from.left}px;top:${from.top}px;width:${from.width}px;`;
    document.body.appendChild(g);
    requestAnimationFrame(() => requestAnimationFrame(() => { g.style.left = to.left + 8 + "px"; g.style.top = to.top + 8 + "px"; g.style.transform = "scale(1.15)"; }));
    setTimeout(() => {
      g.remove();
      piece.classList.remove("entering");
      renderPreview(it.id);
      const t = piece.querySelector(".txt, input");
      if (t && t.classList.contains("txt")) { t.focus(); selectAll(t); }
    }, 470);
  }
  function selectAll(el) { const r = document.createRange(); r.selectNodeContents(el); const s = getSelection(); s.removeAllRanges(); s.addRange(r); }

  // ---------- documento ----------
  const esc = (s) => String(s ?? "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/"/g, "&quot;");
  function pieceHtml(it, entering) {
    const t = tagName(it);
    const tools = `<span class="tools"><button data-act="up" title="Subir">↑</button><button data-act="down" title="Bajar">↓</button><button data-act="del" title="Borrar">✕</button></span>`;
    let inner;
    if (it.tag === "h") {
      inner = `<span class="tag">&lt;h<select data-f="level" title="Nivel del título" style="font:inherit;color:inherit;font-weight:800;border:1px dashed currentColor;border-radius:5px;background:#fff;padding:0 2px">${[1,2,3,4,5,6].map(n => `<option ${n === it.level ? "selected" : ""}>${n}</option>`).join("")}</select>&gt;</span><span class="txt" contenteditable="true" spellcheck="false" data-f="text">${esc(it.text)}</span><span class="tag">&lt;/${t}&gt;</span>`;
    } else if (it.tag === "img") {
      inner = `<span class="tag">&lt;img</span>
        <span class="attr"><span class="an">src</span>=<select data-f="src">${Object.entries(IMAGES).map(([k, v]) => `<option value="${k}" ${k === it.src ? "selected" : ""}>${v.label}</option>`).join("")}</select></span>
        <span class="attr"><span class="an">alt</span>="<input data-f="alt" value="${esc(it.alt)}" size="${Math.max(8, (it.alt || "").length)}">"</span><span class="tag">&gt;</span>`;
    } else if (it.tag === "input") {
      inner = `<span class="tag">&lt;input</span>
        <span class="attr"><span class="an">type</span>="<select data-f="type">${["text", "email", "password", "number", "date", "checkbox", "color"].map(v => `<option ${v === it.type ? "selected" : ""}>${v}</option>`).join("")}</select>"</span>
        <span class="attr"><span class="an">placeholder</span>="<input data-f="placeholder" value="${esc(it.placeholder)}" size="${Math.max(8, (it.placeholder || "").length)}">"</span><span class="tag">&gt;</span>`;
    } else if (it.tag === "a") {
      inner = `<span class="tag">&lt;a</span> <span class="attr"><span class="an">href</span>="<select data-f="href">${["https://www.google.com", "https://www.wikipedia.org", "contacto.html"].map(v => `<option ${v === it.href ? "selected" : ""}>${v}</option>`).join("")}</select>"</span><span class="tag">&gt;</span><span class="txt" contenteditable="true" spellcheck="false" data-f="text">${esc(it.text)}</span><span class="tag">&lt;/a&gt;</span>`;
    } else {
      inner = `<span class="tag">&lt;${t}&gt;</span><span class="txt" contenteditable="true" spellcheck="false" data-f="text">${esc(it.text)}</span><span class="tag">&lt;/${t}&gt;</span>`;
    }
    return `<div class="piece ${entering ? "entering" : ""}" data-id="${it.id}" style="--c:${colorOf(it)}"><span class="grip" title="Arrastrar">⋮⋮</span>${inner}${tools}</div>`;
  }
  function renderDoc(enteringId) {
    $("#doc").innerHTML = S.items.length ? S.items.map(it => pieceHtml(it, it.id === enteringId)).join("")
      : `<div class="doc-empty">Tocá una pieza de la izquierda para agregarla a tu página.</div>`;
    if (enteringId == null) renderPreview();
    else renderPreview(null, enteringId); // la nueva todavía no se muestra
    if (S.mode === "challenge") renderChecklist();
  }
  function renderPreview(newId, hideId) {
    renderPage(pageRoot, S.items.filter(i => i.id !== hideId), newId);
    if (newId != null) {
      const el = pageRoot.querySelector(`[data-id="${newId}"]`);
      el?.scrollIntoView({ block: "nearest", behavior: "smooth" });
    }
    refreshXray();
    if (S.mode === "challenge") renderChecklist();
  }
  function refreshXray() {
    if (S.xray) drawXray(pageRoot, $("#xrayLayer"), $("#viewport"), S.items, S.hot);
    else if (S.hot != null) drawXray(pageRoot, $("#xrayLayer"), $("#viewport"), S.items, S.hot, S.hot);
    else $("#xrayLayer").innerHTML = "";
  }

  const itemOf = (el) => S.items.find(i => i.id === +el.closest(".piece").dataset.id);
  $("#doc").addEventListener("input", (e) => {
    const f = e.target.dataset.f; if (!f) return;
    const it = itemOf(e.target);
    it[f] = f === "text" ? e.target.textContent : e.target.value;
    if (e.target.tagName === "INPUT") e.target.size = Math.max(8, e.target.value.length);
    renderPreview();
  });
  $("#doc").addEventListener("change", (e) => {
    const f = e.target.dataset.f; if (!f || e.target.tagName !== "SELECT") return;
    const it = itemOf(e.target);
    it[f] = f === "level" ? +e.target.value : e.target.value;
    if (f === "level") { const keep = it.id; renderDoc(); flash(keep); }
    else { renderPreview(); flash(it.id); }
  });
  $("#doc").addEventListener("keydown", (e) => { if (e.key === "Enter" && e.target.classList.contains("txt")) { e.preventDefault(); e.target.blur(); } });
  function flash(id) { const el = pageRoot.querySelector(`[data-id="${id}"]`); if (el) { el.classList.remove("new"); void el.offsetWidth; el.classList.add("new"); } }

  $("#doc").addEventListener("click", (e) => {
    const b = e.target.closest("[data-act]"); if (!b) return;
    const it = itemOf(b), i = S.items.indexOf(it), act = b.dataset.act;
    if (act === "del") {
      b.closest(".piece").classList.add("leaving");
      pageRoot.querySelector(`[data-id="${it.id}"]`)?.animate([{ opacity: 1 }, { opacity: 0, transform: "scale(.9)" }], { duration: 250 });
      setTimeout(() => { S.items.splice(S.items.indexOf(it), 1); if (S.hot === it.id) S.hot = null; renderDoc(); }, 250);
    } else {
      const j = act === "up" ? i - 1 : i + 1; if (j < 0 || j >= S.items.length) return;
      [S.items[i], S.items[j]] = [S.items[j], S.items[i]];
      renderDoc(); flash(it.id);
    }
  });

  // arrastrar para reordenar
  let dragId = null;
  // sólo se puede arrastrar desde el ⋮⋮ (así se puede seleccionar el texto de las piezas)
  $("#doc").addEventListener("mousedown", (e) => { const g = e.target.closest(".grip"); if (g) g.closest(".piece").draggable = true; });
  addEventListener("mouseup", () => document.querySelectorAll(".piece[draggable=true]").forEach(p => { if (dragId == null) p.draggable = false; }));
  $("#doc").addEventListener("dragstart", (e) => {
    const p = e.target.closest?.(".piece"); if (!p) return;
    dragId = +p.dataset.id; p.classList.add("dragging"); e.dataTransfer.effectAllowed = "move"; e.dataTransfer.setData("text/plain", dragId);
  });
  $("#doc").addEventListener("dragover", (e) => {
    const p = e.target.closest(".piece"); if (!p || dragId == null) return;
    e.preventDefault();
    document.querySelectorAll(".drop-before,.drop-after").forEach(x => x.classList.remove("drop-before", "drop-after"));
    const r = p.getBoundingClientRect();
    p.classList.add(e.clientY < r.top + r.height / 2 ? "drop-before" : "drop-after");
  });
  $("#doc").addEventListener("drop", (e) => {
    const p = e.target.closest(".piece"); if (!p || dragId == null) return;
    e.preventDefault();
    const before = p.classList.contains("drop-before");
    const moving = S.items.find(i => i.id === dragId);
    S.items.splice(S.items.indexOf(moving), 1);
    let idx = S.items.findIndex(i => i.id === +p.dataset.id);
    if (idx === -1) idx = S.items.length; else if (!before) idx++;
    S.items.splice(idx, 0, moving);
    const id = dragId; dragId = null; renderDoc(); flash(id);
  });
  $("#doc").addEventListener("dragend", () => { dragId = null; document.querySelectorAll(".dragging,.drop-before,.drop-after").forEach(x => x.classList.remove("dragging", "drop-before", "drop-after")); });

  // pasar el mouse por una pieza ilumina el elemento en el navegador (y al revés)
  function setHot(id) {
    if (S.hot === id) return;
    S.hot = id;
    document.querySelectorAll(".piece.hot").forEach(p => p.classList.remove("hot"));
    if (id != null) $(`.piece[data-id="${id}"]`)?.classList.add("hot");
    refreshXray();
  }
  $("#doc").addEventListener("mouseover", (e) => { const p = e.target.closest(".piece"); setHot(p ? +p.dataset.id : null); });
  $("#doc").addEventListener("mouseleave", () => setHot(null));
  $("#host").addEventListener("mousemove", (e) => {
    const t = e.composedPath().find(n => n.dataset?.id);
    setHot(t ? +t.dataset.id : null);
  });
  $("#host").addEventListener("mouseleave", () => setHot(null));
  $("#host").addEventListener("click", (e) => {
    const a = e.composedPath().find(n => n.tagName === "A" || n.tagName === "BUTTON");
    if (!a) return;
    e.preventDefault();
    toast(a.tagName === "A" ? `🔗 Este enlace te llevaría a ${a.getAttribute("href")}` : `👆 Apretaste el botón "${a.textContent}". Todavía no hace nada: para eso falta JavaScript.`);
  });
  $("#viewport").addEventListener("scroll", refreshXray);
  addEventListener("resize", () => { refreshXray(); if (S.mode === "game") placeSpot(); });

  function toast(msg) { const t = $("#toast"); t.textContent = msg; t.classList.add("show"); clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove("show"), 2600); }

  $("#xray").addEventListener("change", (e) => { S.xray = e.target.checked; refreshXray(); });
  $("#exampleBtn").onclick = () => { S.items = EXAMPLE(); renderDoc(); };
  $("#clearBtn").onclick = () => { S.items = []; renderDoc(); };

  // ================================================================ desafíos
  const CHALLENGES = [
    { name: "Mi primera página", items: [
      { tag: "h", level: 1, text: "Hola, mundo" },
      { tag: "p", text: "Esta es mi primera página web." } ] },
    { name: "La ficha de un vino", items: [
      { tag: "h", level: 1, text: "Malbec Reserva" },
      { tag: "img", src: "botella.png", alt: "Botella de Malbec" },
      { tag: "p", text: "Un vino intenso de Mendoza." },
      { tag: "button", text: "Comprar" } ] },
    { name: "El newsletter", items: [
      { tag: "h", level: 2, text: "Suscribite" },
      { tag: "p", text: "Recibí novedades todas las semanas." },
      { tag: "input", type: "email", placeholder: "tu@email.com" },
      { tag: "button", text: "Suscribirme" },
      { tag: "a", text: "Ver términos y condiciones", href: "https://www.google.com" } ] },
    { name: "Títulos en orden", items: [
      { tag: "h", level: 1, text: "Agenda de contactos" },
      { tag: "h", level: 2, text: "Favoritos" },
      { tag: "p", text: "Ana Torres" },
      { tag: "h", level: 2, text: "Todos" },
      { tag: "p", text: "Bruno Díaz" },
      { tag: "p", text: "Carla Méndez" } ] },
  ];
  const targetRoot = mountPage($("#targetMini"));
  const norm = (s) => String(s || "").trim().toLowerCase().replace(/\s+/g, " ");
  function describe(t) {
    const n = tagName(t);
    if (t.tag === "img") return `<code>&lt;img&gt;</code> de la ${IMAGES[t.src].label.split(" ")[1]} con alt «${t.alt}»`;
    if (t.tag === "input") return `<code>&lt;input&gt;</code> de tipo <b>${t.type}</b> que diga «${t.placeholder}»`;
    return `<code>&lt;${n}&gt;</code> «${t.text}»`;
  }
  function matches(t, it) {
    if (!it || t.tag !== it.tag) return false;
    if (t.tag === "h") return t.level === it.level && norm(t.text) === norm(it.text);
    if (t.tag === "img") return t.src === it.src && norm(t.alt) === norm(it.alt);
    if (t.tag === "input") return t.type === it.type && norm(t.placeholder) === norm(it.placeholder);
    return norm(t.text) === norm(it.text);
  }
  let celebrated = -1;
  function renderChallenge() {
    const ch = CHALLENGES[S.ch];
    $("#chCount").textContent = `${S.ch + 1} de ${CHALLENGES.length} · ${ch.name}`;
    renderPage(targetRoot, ch.items.map((x, k) => ({ id: -1 - k, ...x })));
    renderChecklist();
  }
  function renderChecklist() {
    const ch = CHALLENGES[S.ch];
    const done = ch.items.map((t, k) => matches(t, S.items[k]));
    $("#checklist").innerHTML = ch.items.map((t, k) => `<li class="${done[k] ? "done" : ""}"><span class="ck">${done[k] ? "✓" : k + 1}</span><span>${describe(t)}</span></li>`).join("")
      + (S.items.length > ch.items.length ? `<li style="color:var(--warn)"><span class="ck">!</span><span>Sobran piezas: el objetivo tiene ${ch.items.length}.</span></li>` : "");
    const all = done.every(Boolean) && S.items.length === ch.items.length;
    if (all && celebrated !== S.ch) { celebrated = S.ch; confetti(); toast("🎉 ¡Desafío cumplido!"); }
    if (!all && celebrated === S.ch) celebrated = -1;
  }
  $("#chPrev").onclick = () => { S.ch = (S.ch - 1 + CHALLENGES.length) % CHALLENGES.length; S.items = []; celebrated = -1; renderDoc(); renderChallenge(); };
  $("#chNext").onclick = () => { S.ch = (S.ch + 1) % CHALLENGES.length; S.items = []; celebrated = -1; renderDoc(); renderChallenge(); };

  function confetti() {
    const colors = ["#e44d26", "#2a9d8f", "#1a5fb4", "#7b2cbf", "#d6336c", "#ffd166"];
    for (let k = 0; k < 90; k++) {
      const c = document.createElement("div");
      c.className = "confetti";
      c.style.left = Math.random() * 100 + "vw";
      c.style.background = colors[k % colors.length];
      c.style.animationDuration = 1.6 + Math.random() * 1.8 + "s";
      c.style.animationDelay = Math.random() * .4 + "s";
      document.body.appendChild(c);
      setTimeout(() => c.remove(), 4000);
    }
  }

  // ================================================================ juego: ¿qué etiqueta es?
  const GAME_PAGES = [
    { addr: "vinoteca.html", items: [
      { tag: "h", level: 1, text: "Vinoteca del Valle" },
      { tag: "a", text: "Inicio", href: "#" }, { tag: "a", text: "Vinos", href: "#" }, { tag: "a", text: "Contacto", href: "#" },
      { tag: "img", src: "paisaje.png", alt: "Viñedos" },
      { tag: "h", level: 2, text: "Vino del mes" },
      { tag: "p", text: "Un Malbec de altura con notas a frutos rojos. Ideal para acompañar un asado." },
      { tag: "button", text: "Agregar al carrito" },
      { tag: "h", level: 3, text: "¿Querés ofertas?" },
      { tag: "input", type: "email", placeholder: "tu@email.com" },
      { tag: "button", text: "Suscribirme" } ] },
    { addr: "adopciones.html", items: [
      { tag: "h", level: 1, text: "Adoptá un gato" },
      { tag: "p", text: "Michi tiene dos años, es tranquilo y le encanta dormir al sol." },
      { tag: "img", src: "gato.png", alt: "Michi, un gato naranja" },
      { tag: "h", level: 2, text: "Dejanos tus datos" },
      { tag: "input", type: "text", placeholder: "Tu nombre" },
      { tag: "input", type: "number", placeholder: "Tu teléfono" },
      { tag: "button", text: "Quiero adoptar" },
      { tag: "a", text: "Ver más gatos", href: "#" } ] },
  ];
  const ROUNDS = 8;
  const G = { page: null, items: [], round: 0, score: 0, target: null, answered: false };
  const gameRoot = mountPage($("#gameHost"));
  const OPTIONS = ["h1", "h2", "h3", "p", "a", "img", "button", "input"];
  const optColor = (o) => o.startsWith("h") ? "var(--t-h)" : `var(--t-${o})`;

  function startGame() { G.round = 0; G.score = 0; nextQuestion(); }
  function nextQuestion() {
    if (G.round >= ROUNDS) return endGame();
    const page = GAME_PAGES[G.round % GAME_PAGES.length];
    if (G.page !== page) { G.page = page; G.items = page.items.map(withId); renderPage(gameRoot, G.items); $("#gameAddr").textContent = page.addr; }
    $("#gameXray").innerHTML = "";
    let pick; do { pick = G.items[Math.floor(Math.random() * G.items.length)]; } while (G.target && pick.id === G.target.id && G.items.length > 1);
    G.target = pick; G.answered = false; G.round++;
    const right = tagName(pick);
    const others = OPTIONS.filter(o => o !== right).sort(() => Math.random() - .5).slice(0, 3);
    const opts = [right, ...others].sort(() => Math.random() - .5);
    $("#answers").innerHTML = opts.map(o => `<button data-o="${o}" style="--c:${optColor(o)}">&lt;${o}&gt;</button>`).join("");
    $("#feedback").innerHTML = "";
    $("#nextQ").hidden = true;
    $("#gRound").textContent = `Ronda ${G.round} de ${ROUNDS}`;
    $("#gProg").style.width = ((G.round - 1) / ROUNDS) * 100 + "%";
    $("#gScore").textContent = `⭐ ${G.score}`;
    placeSpot();
  }
  function placeSpot() {
    if (!G.target) return;
    const el = gameRoot.querySelector(`[data-id="${G.target.id}"]`); if (!el) return;
    const vp = $("#gameViewport"), vr = vp.getBoundingClientRect(), r = el.getBoundingClientRect();
    const s = $("#spot");
    s.style.left = r.left - vr.left + vp.scrollLeft - 6 + "px"; s.style.top = r.top - vr.top + vp.scrollTop - 6 + "px";
    s.style.width = r.width + 12 + "px"; s.style.height = r.height + 12 + "px";
    s.hidden = false;
  }
  const WHY = {
    h1: "Es el título principal de la página. Va uno solo y es el más grande.",
    h2: "Es un subtítulo: abre una sección dentro de la página.",
    h3: "Es un título de tercer nivel: una sección dentro de una sección.",
    p: "Es un párrafo: un bloque de texto común.",
    a: "Es un enlace: si lo tocás, te lleva a otra página. Por defecto se ve azul y subrayado.",
    img: "Es una imagen. No tiene etiqueta de cierre y su texto alternativo (alt) lo leen los lectores de pantalla.",
    button: "Es un botón: algo para apretar. Lo que hace al apretarlo se programa con JavaScript.",
    input: "Es un campo para que el usuario escriba. El texto gris es el placeholder.",
  };
  $("#answers").addEventListener("click", (e) => {
    const b = e.target.closest("button[data-o]"); if (!b || G.answered) return;
    G.answered = true;
    const right = tagName(G.target);
    const ok = b.dataset.o === right;
    if (ok) G.score++;
    $("#answers").querySelectorAll("button").forEach(x => { x.disabled = true; if (x.dataset.o === right) x.classList.add("right"); });
    if (!ok) b.classList.add("wrong");
    $("#feedback").innerHTML = (ok ? "🎯 <strong>¡Correcto!</strong> " : `😅 <strong>Era &lt;${right}&gt;.</strong> `) + WHY[right];
    $("#gScore").textContent = `⭐ ${G.score}`;
    $("#gProg").style.width = (G.round / ROUNDS) * 100 + "%";
    drawXray(gameRoot, $("#gameXray"), $("#gameViewport"), G.items, G.target.id, G.target.id);
    $("#nextQ").hidden = false;
    $("#nextQ").textContent = G.round >= ROUNDS ? "Ver resultado ▶" : "Siguiente ▶";
    if (ok) confettiSmall(b);
  });
  $("#nextQ").onclick = nextQuestion;
  function confettiSmall(btn) { btn.animate([{ transform: "scale(1)" }, { transform: "scale(1.12)" }, { transform: "scale(1)" }], { duration: 400 }); }
  function endGame() {
    $("#spot").hidden = true;
    drawXray(gameRoot, $("#gameXray"), $("#gameViewport"), G.items, null);
    $("#answers").innerHTML = "";
    $("#gRound").textContent = "¡Terminado!";
    $("#feedback").innerHTML = `<div style="font-size:1.6rem;font-weight:800">${G.score} de ${ROUNDS} ${G.score >= ROUNDS - 1 ? "🏆" : G.score >= ROUNDS / 2 ? "👏" : "💪"}</div>Así se ve la página con rayos X: cada caja es una etiqueta.`;
    $("#nextQ").hidden = false; $("#nextQ").textContent = "Jugar de nuevo ↻";
    $("#nextQ").onclick = () => { $("#nextQ").onclick = nextQuestion; startGame(); };
    if (G.score >= ROUNDS / 2) confetti();
  }

  // ================================================================ modos
  $("#modeSeg").addEventListener("click", (e) => {
    const b = e.target.closest("button"); if (!b) return;
    $("#modeSeg").querySelectorAll("button").forEach(x => x.setAttribute("aria-pressed", x === b));
    setMode(b.dataset.v);
  });
  let buildBackup = null;
  function setMode(m) {
    const prev = S.mode; S.mode = m;
    $("#workspace").hidden = m === "game";
    $("#game").hidden = m !== "game";
    $("#buildTools").style.visibility = m === "build" ? "visible" : "hidden";
    $("#challengeBox").hidden = m !== "challenge";
    if (prev === "build" && m !== "build") buildBackup = S.items;
    if (m === "build") { S.items = buildBackup || S.items; renderDoc(); }
    if (m === "challenge") { S.items = []; celebrated = -1; renderDoc(); renderChallenge(); }
    if (m === "game") { $("#spot").hidden = false; requestAnimationFrame(startGame); }
    if (m !== "challenge" && prev === "challenge" && m !== "game") renderDoc();
  }

  S.items = EXAMPLE();
  renderDoc();
})();
</script>
</body>
</html>
